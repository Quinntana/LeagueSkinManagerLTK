[package]
name = "ltk-engine"
version = "0.1.0"
edition = "2024"
description = "UI-independent JSON-lines sidecar for LeagueToolkit package inspection and overlay building"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Quinntana/LeagueSkinManagerLTK"
publish = false

[lib]
name = "ltk_engine"
path = "src/lib.rs"

[[bin]]
name = "ltk-engine"
path = "src/main.rs"

[dependencies]
camino = "=1.2.5"
ltk_fantome = "=0.7.0"
ltk_modpkg = "=0.9.0"
ltk_overlay = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
zip = "=8.6.0"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
