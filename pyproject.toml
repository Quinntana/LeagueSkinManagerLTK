[project]
name = "LeagueSkinManagerLTK"
version = "0.1.0"
description = "A searchable custom-mod library with an isolated LeagueToolkit engine"
authors = [{ name = "Quinntana", email = "archimedesstar@gmail.com" }]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pystray>=0.19.5,<0.20.0",
    "psutil>=7.2.2,<8.0.0",
    "Pillow>=12.3.0,<13.0.0",
]

[project.scripts]
league-skin-manager = "league_skin_manager.__main__:main"
league-skin-manager-uninstall = "league_skin_manager.uninstall:main"
league-skin-manager-setup = "league_skin_manager.installer:main"

[project.urls]
Repository = "https://github.com/Quinntana/LeagueSkinManagerLTK"
Issues = "https://github.com/Quinntana/LeagueSkinManagerLTK/issues"

[tool.poetry]
packages = [{ include = "league_skin_manager", from = "src" }]

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.15.0"
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
ruff = "^0.15.22"
mypy = "^2.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["PIL.*", "psutil.*", "pystray.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q --cov=league_skin_manager --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
    "src/league_skin_manager/__main__.py",
    "src/league_skin_manager/main.py",
    "src/league_skin_manager/uninstall.py",
]
