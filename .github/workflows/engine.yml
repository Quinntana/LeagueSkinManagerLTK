name: LTK Engine

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ltk-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Check formatting
        run: cargo fmt --manifest-path engine/Cargo.toml --all -- --check

      - name: Lint
        run: cargo clippy --manifest-path engine/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path engine/Cargo.toml --locked --all-features

      - name: Build release sidecar
        run: cargo build --manifest-path engine/Cargo.toml --locked --release
