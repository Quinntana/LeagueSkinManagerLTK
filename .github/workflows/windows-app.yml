name: Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-package:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Install locked Python environment
        run: |
          python -m pip install --disable-pip-version-check poetry==2.2.1
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Build isolated LTK engine
        run: cargo build --manifest-path engine/Cargo.toml --release --locked

      - name: Check Python formatting and lint
        run: |
          poetry run ruff format --check .
          poetry run ruff check .

      - name: Type-check Python
        run: poetry run mypy src

      - name: Test Python
        run: poetry run pytest

      - name: Build Windows setup
        run: poetry run python build.py

      - name: Upload unsigned developer build
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: LeagueSkinManagerLTK-windows-unsigned
          path: dist/**
          if-no-files-found: error
          retention-days: 7
